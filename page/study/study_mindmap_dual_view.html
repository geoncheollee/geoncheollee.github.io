<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>스터디 지식 마인드맵 2023–2026</title>
<style>
:root{--bg:#f4f7fb;--panel:#fff;--text:#172033;--muted:#6f7a90;--line:#cdd7e6;--shadow:0 12px 30px rgba(32,49,89,.10)}
*{box-sizing:border-box} body{margin:0;font-family:Pretendard,"Noto Sans KR",system-ui,sans-serif;background:var(--bg);color:var(--text)}
button,input{font:inherit} header{position:sticky;top:0;z-index:20;background:rgba(244,247,251,.92);backdrop-filter:blur(12px);border-bottom:1px solid #e4e9f2}
.toolbar{max-width:1500px;margin:auto;padding:14px 20px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.brand{font-weight:850;font-size:18px;margin-right:auto} .brand small{display:block;font-weight:500;color:var(--muted);font-size:12px;margin-top:2px}
.search{min-width:260px;padding:10px 12px;border:1px solid #d7dfec;border-radius:12px;background:white}
.chips,.view-toggle{display:flex;gap:6px;flex-wrap:wrap} .chip,.view-btn{border:1px solid #d7dfec;background:white;border-radius:999px;padding:8px 11px;cursor:pointer;color:#526079}
.chip.active,.view-btn.active{background:#233357;color:white;border-color:#233357}
.view-toggle{padding:4px;background:#e9eef7;border-radius:999px} .view-btn{border:0;background:transparent} .view-btn.active{box-shadow:0 2px 7px rgba(20,35,70,.18)}
main{max-width:1500px;margin:auto;padding:26px 20px 80px} .hero{display:grid;grid-template-columns:1.25fr .75fr;gap:16px;margin-bottom:24px}
.intro,.stats{background:var(--panel);border:1px solid #e3e8f1;border-radius:20px;box-shadow:var(--shadow)} .intro{padding:24px} .intro h1{margin:0 0 9px;font-size:28px} .intro p{margin:0;color:var(--muted);line-height:1.7}
.stats{padding:18px;display:grid;grid-template-columns:repeat(3,1fr);gap:10px} .stat{background:#f7f9fd;border-radius:14px;padding:14px;text-align:center} .stat b{display:block;font-size:24px} .stat span{font-size:12px;color:var(--muted)}
.root-wrap{display:flex;justify-content:center;position:relative;padding-bottom:34px} .root{background:linear-gradient(135deg,#24345e,#5269db);color:white;border-radius:20px;padding:17px 28px;box-shadow:0 15px 35px rgba(48,68,150,.25);text-align:center;position:relative}
.root:after{content:"";position:absolute;width:2px;height:34px;background:var(--line);left:50%;top:100%} .root small{display:block;opacity:.78;margin-top:4px}
.map{position:relative;display:grid;grid-template-columns:repeat(4,minmax(250px,1fr));gap:18px;align-items:start} .map.tech-mode{grid-template-columns:repeat(3,minmax(280px,1fr))}
.map:before{content:"";position:absolute;height:2px;background:var(--line);top:-1px;left:12.5%;right:12.5%} .branch{position:relative;padding-top:24px} .branch:before{content:"";position:absolute;left:50%;top:0;height:24px;width:2px;background:var(--line)}
.card{background:var(--panel);border:1px solid #e0e6ef;border-radius:18px;box-shadow:var(--shadow);overflow:hidden} .card-head{padding:16px 17px;color:white;display:flex;align-items:center;justify-content:space-between;gap:10px}
.card-head h2{font-size:18px;margin:0} .card-head span{font-size:12px;opacity:.88} .card-body{padding:12px} .year{border:1px solid #e5eaf2;border-radius:13px;margin:8px 0;overflow:hidden;background:#fbfcfe}
.year-title{padding:10px 12px;font-weight:800;display:flex;justify-content:space-between;cursor:pointer} .year-title span{font-weight:500;font-size:12px;color:var(--muted)} .nodes{padding:0 9px 9px;display:grid;gap:7px}
.node{width:100%;border:0;text-align:left;background:white;border-left:4px solid var(--accent);border-radius:10px;padding:10px;box-shadow:0 2px 8px rgba(30,45,80,.07);cursor:pointer;transition:.15s}
.node:hover{transform:translateY(-1px);box-shadow:0 6px 14px rgba(30,45,80,.12)} .node-row{display:flex;align-items:flex-start;justify-content:space-between;gap:10px} .node strong{font-size:13px;line-height:1.45} .node small{display:block;color:var(--muted);margin-top:5px}
.presenter{flex:0 0 auto;padding:3px 7px;border-radius:999px;color:white;font-size:11px;font-weight:750;line-height:1.4}
.tech-summary{font-size:12px;color:var(--muted);padding:2px 3px 8px} .empty{padding:30px;text-align:center;color:var(--muted);grid-column:1/-1}
.common{margin-top:28px;background:white;border:1px solid #e0e6ef;border-radius:18px;padding:18px} .common h3{margin:0 0 12px} .common-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:9px} .common-item{background:#f7f9fd;border-radius:12px;padding:11px} .common-item b{font-size:13px} .common-item small{display:block;color:var(--muted);margin-top:5px}

.modal-body{padding:22px} .meta{color:var(--muted);font-size:13px;margin-bottom:16px} .topic-list{margin:0;padding-left:20px;line-height:1.8} .links{margin-top:18px;display:grid;gap:7px} .links a{color:#415ac4;overflow-wrap:anywhere}
.legend{display:flex;gap:10px;flex-wrap:wrap;margin-top:13px;color:var(--muted);font-size:12px} .dot{width:9px;height:9px;border-radius:50%;display:inline-block;margin-right:4px}

@media(max-width:700px){.hero{grid-template-columns:1fr}.map,.map.tech-mode{grid-template-columns:1fr}.root-wrap{padding-bottom:18px}.root:after{display:none}.search{width:100%;min-width:0}}

</head>

const categoryOrder=Object.keys(categoryColors);
let selectedYear="전체", viewMode="tech";
const $=s=>document.querySelector(s);
function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function groupBy(arr,keyOrFn){return arr.reduce((a,x)=>{const k=typeof keyOrFn==="function"?keyOrFn(x):x[keyOrFn];(a[k]??=[]).push(x);return a},{})}
function categoryOf(r){
 const s=[r.title,...r.items].join(" ").toLowerCase();
 if(/security|시큐리티|jwt|cors|sop|인증|인가|브루트포스|암호|난독화/.test(s)) return "보안 · 인증";
 if(/oracle|mysql|mariadb|postgres|tibero|redis|레디스|sql|query|쿼리|jpa|hibernate|mybatis|db |database|connection pool|elasticsearch|검색엔진|인덱스|in절|exists/.test(s)) return "데이터베이스 · 검색";
 if(/nginx|tomcat|톰캣|apache|아파치|docker|cloudflare|배포|이중화|클러스터|nas|서버|jenkins|무중단|로드밸런|websocket/.test(s)) return "인프라 · DevOps";
 if(/android|안드로이드|react native|react-native|앱 |어플|admob|애드몹|녹화앱|게임 리더보드/.test(s)) return "모바일 · 앱";
 if(/react|javascript|jquery|thymeleaf|html|css|proxy|promise|viewresolver|form데이터|팝업|redux|recoil|usestate|useeffect|usememo|usecallback|tanstack/.test(s)) return "프론트엔드 · 웹";
 if(/cqrs|hexagonal|헥사고날|architecture|아키텍처|aop|filter, interceptor|dispatcher|패턴|설계/.test(s)) return "아키텍처 · 설계";
 if(/tdd|테스트|코드리뷰|코테|포트폴리오|git |개발 문화|기술 블로그/.test(s)) return "테스트 · 개발문화";
 if(/spring|스프링|transaction|트랜잭션|controller|service|dao|rest api|session|세션|bean|requestmapping|pathvariable|requestparam|properties|yml/.test(s)) return "백엔드 · Spring";
 return "프로젝트 · 기타";
}
function getFiltered(){
 const query=$("#search").value.trim().toLowerCase();
 return records.filter(r=>(selectedYear==="전체"||r.year===selectedYear)&&(!query||[r.person,r.title,...r.items,categoryOf(r)].join(" ").toLowerCase().includes(query)));
}
function render(){
 const filtered=getFiltered(), map=$("#map"); map.innerHTML="";
 map.classList.toggle("tech-mode",viewMode==="tech");
 if(viewMode==="tech") renderByTech(filtered,map); else renderByPerson(filtered,map);
 if(!map.children.length) map.innerHTML='<div class="empty">검색 조건에 맞는 기록이 없습니다.</div>';
 document.querySelectorAll(".node").forEach(n=>n.addEventListener("click",()=>openDetail(records[+n.dataset.id])));
 updateStats(filtered);
}
function renderByPerson(filtered,map){
 const byPerson=groupBy(filtered,"person");
 personOrder.filter(p=>records.some(r=>r.person===p)).forEach(person=>{
   const rs=byPerson[person]||[]; if(!rs.length)return;
   const byYear=groupBy(rs,"year"), branch=document.createElement("div");
   branch.className="branch"; branch.style.setProperty("--accent",colors[person]);
   const yearsHtml=Object.keys(byYear).sort().map(y=>{
     const nodes=byYear[y].map(r=>`<button class="node" data-id="${records.indexOf(r)}"><strong>${esc(r.title)}</strong><small>${esc(r.round)} · ${esc(r.date)}</small></button>`).join("");
     return `<section class="year"><div class="year-title" onclick="this.nextElementSibling.hidden=!this.nextElementSibling.hidden">${y}년 <span>${byYear[y].length}개</span></div><div class="nodes">${nodes}</div></section>`;
   }).join("");
   branch.innerHTML=`<article class="card"><div class="card-head" style="background:${colors[person]}"><h2>${esc(person)}</h2><span>${rs.length}개 기록</span></div><div class="card-body">${yearsHtml}</div></article>`;
   map.appendChild(branch);
 });
}
function renderByTech(filtered,map){
 const byCategory=groupBy(filtered,categoryOf);
 categoryOrder.forEach(category=>{
   const rs=byCategory[category]||[]; if(!rs.length)return;
   const branch=document.createElement("div"); branch.className="branch"; branch.style.setProperty("--accent",categoryColors[category]);
   const byYear=groupBy(rs,"year");
   const yearsHtml=Object.keys(byYear).sort().map(y=>{
     const nodes=byYear[y].map(r=>`<button class="node" data-id="${records.indexOf(r)}"><span class="node-row"><strong>${esc(r.title)}</strong><span class="presenter" style="background:${colors[r.person]||colors["미분류"]}">${esc(r.person)}</span></span><small>${esc(r.round)} · ${esc(r.date)}</small></button>`).join("");
     return `<section class="year"><div class="year-title" onclick="this.nextElementSibling.hidden=!this.nextElementSibling.hidden">${y}년 <span>${byYear[y].length}개</span></div><div class="nodes">${nodes}</div></section>`;
   }).join("");
   const presenters=[...new Set(rs.map(r=>r.person))].join(" · ");
   branch.innerHTML=`<article class="card"><div class="card-head" style="background:${categoryColors[category]}"><h2>${esc(category)}</h2><span>${rs.length}개 주제</span></div><div class="card-body"><div class="tech-summary">발표자: ${esc(presenters)}</div>${yearsHtml}</div></article>`;
   map.appendChild(branch);
 });
}
function setView(mode){

   $("#heroTitle").textContent="기술을 중심으로 연결한 지식 지도";

   $("#rootTitle").textContent="스터디"; $("#rootSubtitle").textContent="발표자 → 연도 → 발표 주제";

}
function openDetail(r){
 $("#modalHead").style.background=colors[r.person]||"#334"; $("#modalTitle").textContent=r.title;

 $("#modalItems").innerHTML=(r.items.length?r.items:[r.title]).map(x=>`<li>${esc(x)}</li>`).join("");
 $("#modalLinks").innerHTML=r.urls.map((u,i)=>`<a href="${esc(u)}" target="_blank" rel="noopener">관련 링크 ${i+1} ↗</a>`).join("");
 $("#detail").showModal();
}
function updateStats(rs){$("#personCount").textContent=new Set(rs.map(r=>r.person)).size;$("#sessionCount").textContent=rs.length;$("#topicCount").textContent=rs.reduce((n,r)=>n+r.items.length,0)}

$("#legend").innerHTML=personOrder.filter(p=>records.some(r=>r.person===p)).map(p=>`<span><i class="dot" style="background:${colors[p]}"></i>${p}</span>`).join("");
$("#commonGrid").innerHTML=common.map(r=>`<div class="common-item"><b>${esc(r.title)}</b><small>${r.year}년 · ${esc(r.round)}</small></div>`).join("");
$("#detail").addEventListener("click",e=>{if(e.target===$("#detail"))$("#detail").close()});
render();
</script></body></html>
